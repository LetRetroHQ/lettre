<script>
// Sidebar mode guard — set the width-based data-nav on <html> before first paint so the
// sidebar renders in its final width with no flash. The collapse toggle's override is
// session-only (in-memory in client/shell.ts), so a fresh load always starts from this
// default; keep this width formula in sync with computeNavMode() there.
(() => {
  try {
    const saved = localStorage.getItem("lettre-theme");
    document.documentElement.dataset.theme = saved === "light" || saved === "dark"
      ? saved : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  } catch { document.documentElement.dataset.theme = "light"; }
  const w = window.innerWidth;
  const mode = w < 540 || w > 1024 ? "full" : "rail";
  document.documentElement.dataset.nav = mode;
})();
</script>
</head>

     editor never flashes the sidebar first. -->

<!-- Mobile only: a hamburger that slides the publication sidebar in as a drawer
     (no bottom tabs). Hidden on desktop and inside the editor / reference room. -->
<button type="button" class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
</button>
<div class="nav-scrim" id="navScrim" hidden></div>
<!-- Publication workspace: a left sidebar (brand → Dashboard, primary nav, account,
     tool footer) beside the routed view. The editor route hides the sidebar for a
     full-width writing canvas (body.editor-mode); the reference room (Docs/API) hides
     it too and renders its own top bar (body.tool-mode). Admin→public
     links are fine (View publication ↗); the reverse is never emitted (SPEC §10). -->
<div class="layout">
  <aside class="sidebar" aria-label="Publication">
    <!-- The column stretches to the full page height (its background + divider run all
         the way down); this inner wrapper is the sticky, viewport-tall part that pins
         the nav as you scroll, so the column never ends short of the viewport. -->
    <div class="sidebar-inner">
    <div class="sidebar-top">
      <a class="brand" href="#/dashboard" id="brandLink" aria-label="Dashboard: publication home">
        <span class="brand-logo" id="brandLogo" aria-hidden="true"></span>
        <span class="brand-meta">
          <span class="brand-name" id="brandName">Lettre</span>
          <span class="brand-tagline" id="brandTagline" hidden></span>
        </span>
      </a>
      <a class="view-pub" id="viewPub" href="/" target="_blank" rel="noopener" title="View publication">
        <svg class="view-pub-icon" aria-hidden="true"><use href="#i-view"/></svg>
        <span class="view-pub-label">View publication&nbsp;↗</span>
      </a>
      <nav class="nav-primary" aria-label="Primary">
        <a href="#/dashboard" data-view="dashboard"><svg class="nav-icon" aria-hidden="true"><use href="#i-dash"/></svg><span class="nav-label">Dashboard</span></a>
        <a href="#/drafts" data-view="drafts"><svg class="nav-icon" aria-hidden="true"><use href="#i-drafts"/></svg><span class="nav-label">Drafts</span></a>
        <a href="#/uploads" data-view="uploads"><svg class="nav-icon" aria-hidden="true"><use href="#i-drafts"/></svg><span class="nav-label">Uploads</span></a>
        <a href="#/sent" data-view="sent"><svg class="nav-icon" aria-hidden="true"><use href="#i-sent"/></svg><span class="nav-label">Sent</span></a>
        <a href="#/subscribers" data-view="subscribers"><svg class="nav-icon" aria-hidden="true"><use href="#i-subs"/></svg><span class="nav-label">Subscribers</span></a>
        <a href="#/template" data-view="template"><svg class="nav-icon" aria-hidden="true"><use href="#i-template"/></svg><span class="nav-label">Template</span></a>
        <a href="#/settings" data-view="settings"><svg class="nav-icon" aria-hidden="true"><use href="#i-settings"/></svg><span class="nav-label">Settings</span></a>
      </nav>
    </div>
    <div class="sidebar-foot">
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch color theme"><span class="theme-toggle-icon" aria-hidden="true"></span><span class="theme-toggle-label">Theme</span></button>
      <div id="identity" class="identity" role="status" aria-label="Signed-in identity"></div>
      <!-- The Lettre mark is the single entry to the app's own room — the docs index, the
           guide, and the API reference live there, not in this publisher-facing footer.
           Next to it, only the collapse chevron. -->
      <div class="tool-foot">
        <a class="powered" href="#/docs" title="Lettre by LetRetro: docs, API reference, and version">
          <span class="lettre-mark" aria-hidden="true"></span>
          <span class="powered-label">Lettre <span class="powered-by">by LetRetro</span></span>
        </a>
        <!-- Collapse ↔ expand, tucked into the end of the footer row (chevron
             right-aligned). Flips <html data-nav> for this load only; hidden on
             mobile, where the sidebar is an off-canvas overlay. -->
        <button type="button" class="nav-collapse" id="navCollapse" aria-label="Collapse sidebar" aria-expanded="true">
          <svg class="nav-collapse-icon" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </div>
    </div>
  </aside>
  <main id="app" class="content"></main>
</div>
<!-- Shared unsaved-changes bar: one full-width banner fixed to the bottom of the
     viewport, offset past the sidebar on desktop and edge-to-edge once the sidebar
     is the off-canvas drawer. Every surface with an explicit save + a revertible
     baseline (Settings, the Template page) drives it through the savebar controller
     in client/main.ts; route() detaches it on each navigation. The post editor keeps its own
     autosave + conflict model and deliberately does not use this. -->
<section class="savebar" id="savebar" aria-label="Unsaved changes" aria-live="polite" hidden>
  <div class="savebar-inner">
    <span class="savebar-msg"></span>
    <span class="savebar-acts">
      <button type="button" id="savebarDiscard">Discard</button>
      <button type="button" class="primary" id="savebarSave">Save changes</button>
    </span>
  </div>
</section>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
